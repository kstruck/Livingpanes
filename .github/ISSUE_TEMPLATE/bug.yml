name: Something is broken
description: The wallpaper, Studio or installer does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Settings > System > About, e.g. "Windows 11 24H2 (26100)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Livingpanes version or commit
  - type: dropdown
    id: world
    attributes:
      label: Which world?
      options: [Riverbed, Coral reef, Betta, Plasma globe, Koi pond, Bonfire, A Studio example, My own scene, Not about a world]
  - type: textarea
    id: log
    attributes:
      label: The last lines of the log
      description: "%LOCALAPPDATA%\\Livingpanes\\livingpanes.log. Remove anything private first."
      render: text
